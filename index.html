<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3efe8">
<title>ICHIZEN</title>
<style>
:root{--bg:#f3efe8;--text:#3f3935;--muted:#9a9288;--glass:rgba(255,255,255,.46);--nav:rgba(255,255,255,.50);--shadow:rgba(86,72,58,.07)}
html.dark{--bg:#302d2a;--text:#ece5dc;--muted:#b6ada3;--glass:rgba(255,255,255,.075);--nav:rgba(63,59,55,.44);--shadow:rgba(12,10,9,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",system-ui,sans-serif}
button,textarea{font:inherit;color:inherit;border:0;background:none;padding:0}
#app{position:relative;width:100%;max-width:460px;height:100dvh;margin:auto;background:var(--bg);overflow:hidden;transition:background .8s ease,color .8s ease}
.brand{position:absolute;left:27px;top:27px;font-size:20px;letter-spacing:.045em;font-weight:400}
.menu{position:absolute;right:27px;top:18px;width:48px;height:48px;border-radius:50%;background:var(--glass);box-shadow:0 7px 18px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.menu i,.menu i:before,.menu i:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:1.4px;background:currentColor;transform:translate(-50%,-50%);border-radius:2px}.menu i:before{margin-top:-5.5px}.menu i:after{margin-top:5.5px}
.label{position:absolute;left:50%;top:19.3%;transform:translateX(-50%);font-size:14px;font-weight:600;white-space:nowrap}
.balance-row{position:absolute;left:50%;top:23.3%;transform:translateX(-50%);display:flex;align-items:center;gap:18px}
.balance{font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:64px;line-height:.92;font-weight:300;letter-spacing:-.04em;font-variant-numeric:proportional-nums lining-nums;font-feature-settings:"pnum" 1,"lnum" 1,"kern" 1;text-rendering:geometricPrecision}
.add{width:48px;height:48px;border-radius:50%;background:var(--glass);box-shadow:0 7px 18px var(--shadow);position:relative}.add:before,.add:after{content:"";position:absolute;left:50%;top:50%;width:20px;height:1.25px;background:currentColor;transform:translate(-50%,-50%)}.add:after{transform:translate(-50%,-50%) rotate(90deg)}
.stage{position:absolute;left:50%;top:31.5%;transform:translateX(-50%);width:min(82vw,330px);aspect-ratio:1}.orb-btn{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb-shadow{position:absolute;left:50%;bottom:5%;width:62%;height:8%;transform:translateX(-50%);border-radius:50%;background:rgba(86,70,54,.09);filter:blur(16px);transition:background 1.8s ease}html.dark .orb-shadow{background:rgba(12,10,9,.25)}
.glow{position:absolute;left:50%;top:58%;width:56%;height:56%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,199,110,.9),rgba(239,173,80,.30) 38%,transparent 72%);filter:blur(27px);opacity:.18;transition:opacity 1.8s ease,transform 1.8s ease}
.orb-fallback{position:absolute;left:50%;top:49%;width:75%;height:75%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 36% 27%,rgba(255,255,255,.9) 0 5%,rgba(255,255,255,.47) 18%,rgba(230,220,208,.45) 55%,rgba(196,183,166,.28) 74%,rgba(255,255,255,.56) 77%,transparent 82%),radial-gradient(circle at 50% 72%,rgba(255,222,148,.68),rgba(255,187,79,.24) 18%,transparent 42%);box-shadow:inset -14px -10px 28px rgba(110,95,80,.11),inset 10px 8px 24px rgba(255,255,255,.34);transition:opacity .35s ease,filter 1.8s ease}
.orb-fallback:after{content:"";position:absolute;left:6%;right:6%;bottom:-16%;height:29%;border-radius:50%;background:linear-gradient(180deg,#e7ded2,#cfc2b2);box-shadow:inset 0 5px 12px rgba(255,255,255,.42),0 10px 18px rgba(80,65,50,.10);z-index:-1}
.orb-real{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;opacity:0;filter:brightness(1.01) contrast(1.02) saturate(.98);transition:opacity .35s ease,filter 1.8s ease;user-select:none;-webkit-user-drag:none}.stage.orb-loaded .orb-real{opacity:1}.stage.orb-loaded .orb-fallback{opacity:0}
html.dark .orb-real{filter:brightness(.78) contrast(1.10) saturate(.82)}html.dark .orb-fallback{filter:brightness(.68) saturate(.72)}
.stage.level-1 .glow{opacity:.07;transform:translate(-50%,-50%) scale(.78)}.stage.level-2 .glow{opacity:.12;transform:translate(-50%,-50%) scale(.88)}.stage.level-3 .glow{opacity:.19;transform:translate(-50%,-50%) scale(1)}.stage.level-4 .glow{opacity:.28;transform:translate(-50%,-50%) scale(1.12)}.stage.level-5 .glow{opacity:.38;transform:translate(-50%,-50%) scale(1.24)}
.stage.level-1 .orb-real{filter:brightness(.91) saturate(.93)}.stage.level-2 .orb-real{filter:brightness(.97) saturate(.96)}.stage.level-3 .orb-real{filter:brightness(1.01) saturate(.98)}.stage.level-4 .orb-real{filter:brightness(1.06) saturate(1.0)}.stage.level-5 .orb-real{filter:brightness(1.11) saturate(1.03)}
html.dark .stage.level-1 .orb-real{filter:brightness(.65) saturate(.72)}html.dark .stage.level-2 .orb-real{filter:brightness(.72) saturate(.77)}html.dark .stage.level-3 .orb-real{filter:brightness(.78) saturate(.82)}html.dark .stage.level-4 .orb-real{filter:brightness(.87) saturate(.88)}html.dark .stage.level-5 .orb-real{filter:brightness(.98) saturate(.94)}
.nav{position:absolute;left:24px;right:24px;bottom:max(13px,env(safe-area-inset-bottom));height:58px;border-radius:25px;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 14px;backdrop-filter:blur(23px);-webkit-backdrop-filter:blur(23px);box-shadow:0 6px 20px var(--shadow)}.nav button{height:47px;display:grid;place-items:center;position:relative;color:var(--muted)}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.nav button.active{color:var(--text)}.nav button.active .fill{fill:currentColor;stroke:none}.nav button.active:after{content:"";position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:currentColor}
.panel{position:absolute;inset:0;display:none;background:var(--bg);padding:28px 26px 100px;z-index:10}.panel.open{display:block}.panel h2{font-size:24px;margin:16px 0 24px}.panel p{color:var(--muted)}.close{position:absolute;right:24px;top:20px;font-size:30px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{padding:10px 14px;border-radius:999px;background:var(--glass);box-shadow:0 5px 14px var(--shadow)}
.sheetback{position:absolute;inset:0;display:none;align-items:flex-end;background:rgba(52,45,39,.22);z-index:30}.sheetback.open{display:flex}.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:16px 22px calc(24px + env(safe-area-inset-bottom))}textarea{width:100%;min-height:120px;border:1px solid rgba(120,110,100,.15);border-radius:18px;background:rgba(255,255,255,.16);padding:15px;color:inherit}.primary{width:100%;height:50px;border-radius:999px;background:var(--text);color:var(--bg);margin-top:14px;font-weight:600}
@media(max-height:720px){.brand{top:22px}.menu{top:14px}.label{top:18%}.balance-row{top:22%}.stage{top:30.5%;width:min(79vw,310px)}.nav{height:56px;bottom:9px}}
</style>
</head><body><div id="app">
<div class="brand">ICHIZEN</div><button class="menu" id="menu" aria-label="メニュー"><i></i></button>
<div class="label">現在の徳</div><div class="balance-row"><div class="balance" id="balance">127</div><button class="add" id="add" aria-label="徳を積む"></button></div>
<div class="stage level-3" id="stage"><button class="orb-btn" id="orb" aria-label="授かったものを記録"><span class="orb-shadow"></span><span class="glow"></span><span class="orb-fallback" aria-hidden="true"></span><img id="orbImage" class="orb-real" alt="光る水晶"></button></div>
<nav class="nav" aria-label="メインナビゲーション">
<button class="active" aria-label="ホーム"><svg viewBox="0 0 24 24"><path class="fill" d="M3.5 10.5 12 3l8.5 7.5V21h-6v-6h-5v6h-6z"/></svg></button>
<button aria-label="履歴"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
<button aria-label="もらったもの"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
<button aria-label="振り返り"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 7.4 5M12 7v5l3 2"/><path d="M16 3h5v5"/></svg></button>
<button aria-label="マイページ"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></button>
</nav>
<section class="panel" id="panel"><button class="close" id="closePanel">×</button><h2>設定</h2><div id="panelBody"></div></section>
<div class="sheetback" id="sheetback"><div class="sheet"><h3 id="sheetTitle"></h3><textarea id="entry"></textarea><button class="primary" id="save">記録する</button></div></div>
</div><script src="local-first-db.js?v=1"></script><script>
const KEY='ichizen-state-v4';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}s=s||{balance:127,theme:'auto',entries:[]};const $=q=>document.querySelector(q);
function persist(){localStorage.setItem(KEY,JSON.stringify(s));window.ICHIZENLocalDB?.sync?.()}function resolvedTheme(){const h=new Date().getHours();return s.theme==='dark'||(s.theme==='auto'&&(h>=19||h<7))?'dark':'light'}function levelFor(v){if(v<30)return 1;if(v<80)return 2;if(v<150)return 3;if(v<300)return 4;return 5}
function render(){const mode=resolvedTheme();document.documentElement.classList.toggle('dark',mode==='dark');document.querySelector('meta[name=theme-color]').content=mode==='dark'?'#302d2a':'#f3efe8';$('#balance').textContent=s.balance;const loaded=$('#stage').classList.contains('orb-loaded');$('#stage').className='stage level-'+levelFor(Math.max(0,s.balance))+(loaded?' orb-loaded':'')}
async function loadOrb(){const image=$('#orbImage');try{const urls=[1,2,3,4,5,6].map(i=>`assets/orb-round-part${i}.txt?v=orbfix6`);const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}:${r.status}`);return (await r.text()).trim()}));image.onload=()=>$('#stage').classList.add('orb-loaded');image.onerror=()=>{console.warn('ICHIZEN reconstructed orb decode failed');image.removeAttribute('src')};image.src='data:image/webp;base64,'+parts.join('')}catch(err){console.warn('ICHIZEN orb load failed',err)}}
let type='good';function openSheet(t){type=t;$('#sheetTitle').textContent=t==='good'?'徳を積む':'授かったものを記録';$('#entry').value='';$('#entry').placeholder=t==='good'?'今日した善いこと':'今日、授かった嬉しいこと';$('#sheetback').classList.add('open')}$('#add').onclick=()=>openSheet('good');$('#orb').onclick=()=>openSheet('gift');$('#sheetback').onclick=e=>{if(e.target===$('#sheetback'))$('#sheetback').classList.remove('open')};$('#save').onclick=()=>{const text=$('#entry').value.trim();if(!text)return;const score=type==='good'?3:1;s.balance=Math.max(0,s.balance+(type==='good'?score:-score));s.entries.push({type,text,score,date:Date.now()});persist();render();$('#sheetback').classList.remove('open')};
window.addVirtue=(n=30)=>{s.balance=Math.max(0,s.balance+(Number(n)||0));persist();render();return s.balance};window.useVirtue=(n=30)=>{s.balance=Math.max(0,s.balance-(Number(n)||0));persist();render();return s.balance};window.setVirtue=(n=127)=>{s.balance=Math.max(0,Number(n)||0);persist();render();return s.balance};window.setIchizenTheme=(mode='auto')=>{if(['light','dark','auto'].includes(mode)){s.theme=mode;persist();render()}return s.theme};
function panelHtml(){return `<div class="chips"><button class="chip" onclick="addVirtue(30)">＋30</button><button class="chip" onclick="useVirtue(30)">−30</button><button class="chip" onclick="setVirtue(29)">29</button><button class="chip" onclick="setVirtue(127)">127</button><button class="chip" onclick="setVirtue(150)">150</button><button class="chip" onclick="setVirtue(300)">300</button></div><div class="chips"><button class="chip" onclick="setIchizenTheme('light')">Light</button><button class="chip" onclick="setIchizenTheme('auto')">Auto</button><button class="chip" onclick="setIchizenTheme('dark')">Dark</button></div>`}$('#menu').onclick=()=>{$('#panelBody').innerHTML=panelHtml();$('#panel').classList.add('open')};$('#closePanel').onclick=()=>$('#panel').classList.remove('open');
const qs=new URLSearchParams(location.search);if(qs.has('virtue'))s.balance=Math.max(0,Number(qs.get('virtue'))||0);if(['light','dark','auto'].includes(qs.get('theme')))s.theme=qs.get('theme');persist();render();loadOrb();setInterval(render,60000);
</script></body></html>
